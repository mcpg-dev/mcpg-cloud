[package]
name = "mcpg-cloud"
version = "0.1.0-beta.13"
edition = "2024"
license = "Apache-2.0"
description = "mcpg.cloud tenant CLI: login, publish configs as managed gateways, inspect instances/operations/logs, manage config versions and custom domains. Links cli-core only — not the control-plane server."

[dependencies]
# Shared CLI plumbing: OIDC PKCE login + credentials, Bearer client,
# SSE phase streams, state-dir paths.
mcpg-cli-core = { git = "https://github.com/mcpg-dev/mcpg-cli-core", tag = "v0.1.0-beta.13", version = "=0.1.0-beta.13" }

# CLI
clap = { version = "4", features = ["derive", "env", "wrap_help"] }

# Async + errors
tokio = { version = "1", features = ["full"] }
anyhow = "1"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# HTTP client (Bearer client itself comes from cli-core; reqwest types
# appear in this crate's signatures + the logs SSE drain)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures = "0.3"

# Serde + views
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
url = "2"
# `delete <NAME|UID>` discrimination: uids are UUIDs, names never are.
uuid = "1"

[dev-dependencies]
tempfile = "3"
# The smoke test boots a real CP + Provisioner and drives the helpers
# against the live HTTP API.


